<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoLoop — Site Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <link rel="stylesheet" href="/static/pilnav.css">
  <style><style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #f5f3f0;
      --border: #dddbd7;
      --text:   #1a1814;
      --muted:  #7a7570;
      --faint:  #a09c97;
      --font:   'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100%; padding-bottom: env(safe-area-inset-bottom); }


    .main { flex:1; display:flex; flex-direction:column; padding: 28px 24px 40px; }

    /* ── TOP HEADER ── */
    .top-header { display:flex; align-items:center; gap:16px; margin-bottom:28px; }
    .stage-badge { width:48px; height:48px; border-radius:50%; background:var(--text); color:#f5f3f0; font-size:13px; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .sub-stepper { flex:1; display:flex; align-items:center; }
    .ss-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
    .ss-dot.done    { background:#3d3936; color:#f5f3f0; font-size:14px; }
    .ss-dot.pending { background:#dddbd7; color:var(--muted); }
    .ss-line { flex:1; height:2px; }
    .ss-line.dark { background:var(--text); }
    .ss-line.gray { background:#dddbd7; }

    .section-title { font-size: clamp(20px, 5.5vw, 26px); font-weight:700; letter-spacing:-0.025em; color:var(--text); margin-bottom: 6px; }
    .section-sub   { font-size: 12px; color: var(--faint); font-weight:400; margin-bottom: 28px; line-height:1.5; }

    /* ── LOADING ── */
    .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:16px; color:var(--muted); font-size:13px; }
    .spinner { width:32px; height:32px; border:2.5px solid var(--border); border-top-color:var(--text); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── CARD ROW: card + expand button side by side ── */
    .card-row { display:flex; align-items:center; gap:12px; }
    .result-card {
      flex: 1; min-width: 0;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .card-label {
      font-size: 10px; font-weight:600; color:var(--faint);
      letter-spacing:0.1em; text-transform:uppercase; margin-bottom:12px;
    }

    /* expand toggle — 32px dark circle, same size as sub-stepper dots */
    .expand-btn {
      width:32px; height:32px; border-radius:50%;
      background:var(--text); color:#f5f3f0;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:300; line-height:1;
      flex-shrink:0; border:none; cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition: background 0.15s;
    }
    .expand-btn:active { background:#3d3936; }

    /* expand panel — full-width text below the card-row */
    .expand-panel { display:none; padding: 8px 4px 4px 0; }
    .expand-panel.open { display:block; }
    .expand-note {
      font-size:11.5px; color:var(--muted); line-height:1.65;
      padding: 10px 12px;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 12px;
    }
    .expand-note strong { color:var(--text); font-weight:600; }

    /* ── STAT GRIDS ── */
    .stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .stat-row.two { grid-template-columns:1fr 1fr; }
    .stat { display:flex; flex-direction:column; gap:3px; position:relative; }
    .stat-val { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-0.02em; line-height:1; }
    .stat-unit { font-size:10px; font-weight:400; color:var(--faint); margin-left:2px; }
    .stat-lbl  { font-size:11px; color:var(--muted); line-height:1.4; }
    /* quality sub-number (shown below quality label) */
    .stat-num  { font-size:10px; color:var(--faint); margin-top:1px; }

    /* ── QUALITY TAGS ── */
    .qual-tag {
      display:inline-block; font-size:10px; font-weight:600;
      letter-spacing:0.04em; padding:2px 6px; border-radius:4px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--muted); margin-top:3px;
    }

    /* ── CAPACITY LINES ── */
    .cap-line { font-size:13px; color:var(--text); line-height:1.7; }
    .cap-line.sub { color:var(--muted); font-size:12px; }

    /* spacer between card groups */
    .card-gap { height:10px; }

    /* ── BUTTON ── */
    #results-state { flex:1; display:flex; flex-direction:column; }
    .btn-bottom { margin-top:auto; padding-top:16px; display:flex; justify-content:center; align-items:center; gap:16px; }
    .back-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; overflow:visible; isolation:isolate; background:transparent; color:var(--text); font-family:var(--font); font-weight:700; font-size:0.95rem; letter-spacing:0.01em; line-height:1; padding:11px 20px; border-radius:100px; border:none; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; transition:transform 0.15s ease; }
    .back-btn:active { transform:scale(0.97); }
    .back-btn .sb-fx { position:absolute; inset:-20px; pointer-events:none; z-index:1; }
    .back-btn .sb-fx canvas { display:block; width:100%; height:100%; }
    .back-btn .sb-label { position:relative; z-index:2; white-space:nowrap; }
    #continue-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; overflow:visible; isolation:isolate; background:transparent; color:var(--text); font-family:var(--font); font-weight:700; font-size:0.95rem; letter-spacing:0.01em; line-height:1; padding:11px 28px; min-width:180px; border-radius:100px; border:none; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; transition:transform 0.15s ease; }
    #continue-btn:active { transform:scale(0.97); }
    #continue-btn .sb-fx { position:absolute; inset:-20px; pointer-events:none; z-index:1; }
    #continue-btn .sb-fx canvas { display:block; width:100%; height:100%; }
    #continue-btn .sb-label { position:relative; z-index:2; }

    .error-msg { text-align:center; padding:24px; color:#e05c4a; font-size:13px; line-height:1.6; }

  </style></style>
</head>
<body>

<header class="gl-nav-header">
  <ul class="gl-pill-list" id="gl-pill-nav">
    <li class="gl-pill gl-pill-logo" aria-label="GeoLoop">
      <svg width="20" height="18" viewBox="0 0 22 20" fill="none" aria-hidden="true">
        <rect x="0"  y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="13" y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="0"  y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="13" y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="0"  y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="0"  y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="13" y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="10" y="0"  width="2"  height="20" rx="0.5" fill="rgba(255,255,255,1)"/>
      </svg>
    </li>
    <li class="gl-pill gl-pill-text" data-href="units.html" data-label="GeoLoop">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">GeoLoop</span><span class="gl-pill-label-hover">GeoLoop</span></div>
    </li>
    <li class="gl-pill gl-pill-text" data-href="account.html" data-label="Home">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">Home</span><span class="gl-pill-label-hover">Home</span></div>
    </li>
    <li class="gl-pill gl-pill-text" data-href="contact.html" data-label="Contact">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">Contact</span><span class="gl-pill-label-hover">Contact</span></div>
    </li>
  </ul>
</header>

<main class="main">

  <div class="top-header">
    <div class="stage-badge">1/3</div>
    <div class="sub-stepper">
      <div class="ss-dot done">✓</div>
      <div class="ss-line dark"></div>
      <div class="ss-dot done">✓</div>
      <div class="ss-line dark"></div>
      <div class="ss-dot done">✓</div>
    </div>
  </div>

  <div class="section-title">Site Analysis</div>
  <div class="section-sub">Results for your location and building.</div>

  <div class="loading" id="loading-state">
    <div class="spinner"></div>
    <span>Analyzing site &amp; simulating loads…</span>
  </div>

  <div id="results-state" style="display:none">

    <!-- ── Card 1: Site & Soil ── -->
    <div class="card-row">
      <div class="result-card">
        <div class="card-label">Site &amp; Soil</div>
        <div class="stat-row">
          <div class="stat">
            <div class="stat-val" id="r-k-qual">—</div>
            <div class="stat-lbl">Soil conductivity</div>
            <div class="stat-num" id="r-k-num"></div>
          </div>
          <div class="stat">
            <div class="stat-val" id="r-tg">—<span class="stat-unit" data-unit="temperature">°C</span></div>
            <div class="stat-lbl">Ground temp.</div>
            <div class="qual-tag" id="r-tg-tag"></div>
          </div>
          <div class="stat">
            <div class="stat-val" id="r-climate">—</div>
            <div class="stat-lbl">Climate zone</div>
            <div class="stat-num" id="r-climate-desc"></div>
          </div>
        </div>
      </div>
      <button class="expand-btn" id="btn-soil" aria-label="Learn more about site and soil">+</button>
    </div>
    <div class="expand-panel" id="panel-soil">
      <div class="expand-note" id="note-soil">—</div>
    </div>

    <div class="card-gap"></div>

    <!-- ── Card 2: Building Loads ── -->
    <div class="card-row">
      <div class="result-card">
        <div class="card-label">Building Loads</div>
        <div class="stat-row two">
          <div class="stat" id="stat-heat">
            <div class="stat-val" id="r-qh">—<span class="stat-unit" data-unit="power">kW</span></div>
            <div class="stat-lbl">Peak heating</div>
          </div>
          <div class="stat" id="stat-cool">
            <div class="stat-val" id="r-qc">—<span class="stat-unit" data-unit="power">kW</span></div>
            <div class="stat-lbl">Peak cooling</div>
          </div>
        </div>
      </div>
      <button class="expand-btn" id="btn-loads" aria-label="Learn more about building loads">+</button>
    </div>
    <div class="expand-panel" id="panel-loads">
      <div class="expand-note" id="note-loads">—</div>
    </div>

    <div class="card-gap"></div>

    <!-- ── Card 3: Borehole Capacity ── -->
    <div class="card-row">
      <div class="result-card">
        <div class="card-label">Borehole Capacity</div>
        <div class="cap-line" id="r-cap-shape">—</div>
        <div class="cap-line sub" id="r-cap-range">—</div>
      </div>
      <button class="expand-btn" id="btn-cap" aria-label="Learn more about borehole capacity">+</button>
    </div>
    <div class="expand-panel" id="panel-cap">
      <div class="expand-note" id="note-cap">—</div>
    </div>

    <div class="btn-bottom">
      <button class="back-btn" id="back-btn" onclick="history.back()"><span class="sb-label">‹ Back</span></button>
      <button id="continue-btn" onclick="goNext()">
        <span class="sb-label">Borefield Design</span>
      </button>
    </div>
  </div>

  <div id="error-state" style="display:none" class="error-msg"></div>

</main>

<script src="/static/unit_convert.js"></script>
<script>
// ── Helpers ──
const soilQuality = k => k >= 3.0 ? 'Excellent' : k >= 2.0 ? 'Good' : k >= 1.2 ? 'Moderate' : 'Poor';
const groundTempTag = tg => tg < 12 ? 'Cool' : tg < 16 ? 'Mild' : tg < 20 ? 'Warm' : 'Hot';
const climateDesc = {
  '1A':'Hot-Humid','2A':'Hot-Humid','2B':'Hot-Dry','3A':'Warm-Humid',
  '3B':'Warm-Dry','3C':'Marine','4A':'Mixed-Humid','4B':'Mixed-Dry',
  '4C':'Mixed-Marine','5A':'Cold-Humid','5B':'Cold-Dry',
  '6A':'Very Cold','6B':'Very Cold','7':'Subarctic','8':'Arctic'
};
const shapeLabel = {
  square:'Square (1:1)', rect_2_1:'Rectangle (2:1)',
  l_shape:'L-Shape', u_shape:'U-Shape', elongated:'Elongated (9:1)'
};

function setText(id, v) {
  const el = document.getElementById(id);
  if (!el) return;
  const unit = el.querySelector('.stat-unit');
  if (unit) { el.childNodes[0].nodeValue = v; } else { el.textContent = v; }
}
function refreshUnits() {
  document.querySelectorAll('.stat-unit[data-unit]').forEach(el => el.textContent = GeoUnits.label(el.dataset.unit));
}

function initExpand(btnId, panelId) {
  const btn = document.getElementById(btnId);
  const panel = document.getElementById(panelId);
  if (!btn || !panel) return;
  btn.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    btn.textContent = open ? '−' : '+';
  });
}

// ── Fetch & populate ──
(async function () {
  const params = new URLSearchParams(location.search);
  const get = k => params.get(k) || sessionStorage.getItem('gl_' + k) || '';
  const payload = {
    zip_code:        get('zip'),
    building_type:   get('building_type'),
    floor_area_m2:   get('floor_area_m2') || get('area'),
    num_floors:      get('num_floors')    || get('floors'),
    footprint_shape: get('footprint_shape') || 'rect_2_1',
    building_age:    get('building_age')  || 'existing',
    s_wwr:           get('s_wwr')         || 'unknown',
    s_envelope:      get('s_envelope')    || 'unknown',
    s_glazing:       get('s_glazing')     || 'unknown',
  };

  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const body = await res.text().catch(() => '');
      let msg = '';
      try { const j = JSON.parse(body); msg = j.message || j.error || body; } catch { msg = body; }
      throw new Error(msg || `Server returned status ${res.status}. Make sure the GeoLoop server is running.`);
    }
    const d = await res.json();
    sessionStorage.setItem('gl_result1', JSON.stringify(d));

    const kw  = v => v != null ? GeoUnits.format(Math.abs(v) / 1000, 'power', 0) : '—';
    const fmt = (v, dec=1) => v != null ? (+v).toFixed(dec) : '—';

    // ── Card 1: Site & Soil ──
    const k   = d.k;
    const tg  = d.T_ground;
    const cz  = d.climate_zone || '—';
    setText('r-k-qual', soilQuality(k));
    document.getElementById('r-k-num').textContent = k != null ? `${fmt(k,2)} W/m·K` : '';
    setText('r-tg', GeoUnits.format(tg, 'temperature', 1));
    document.getElementById('r-tg-tag').textContent = tg != null ? groundTempTag(tg) : '';
    setText('r-climate', cz);
    document.getElementById('r-climate-desc').textContent = climateDesc[cz] || '';

    document.getElementById('note-soil').innerHTML =
      `With soil conductivity of <strong>${fmt(k,2)} W/m·K</strong>, your ground has <strong>${soilQuality(k).toLowerCase()}</strong> heat transfer capacity. ${k>=2?'Shorter loops will be sufficient.':'Longer loops will be needed to compensate.'} A ground temperature of <strong>${fmt(tg,1)}°C</strong> (${groundTempTag(tg).toLowerCase()}) in a <strong>${climateDesc[cz]||cz}</strong> climate (Zone ${cz}) means the loop will operate at a ${tg<18?'favorable':'moderate'} thermal gradient year-round.`;

    // ── Card 2: Building Loads ──
    const qh = d.q_h, qc = d.q_c;
    setText('r-qh', kw(qh));
    setText('r-qc', kw(qc));
    refreshUnits();

    // Dominant load labels for expand note
    const heatDom = qh >= qc;
    const domLabel = heatDom ? 'heating' : 'cooling';
    const othLabel = heatDom ? 'cooling' : 'heating';
    const domVal   = heatDom ? kw(qh) : kw(qc);
    const othVal   = heatDom ? kw(qc) : kw(qh);

    document.getElementById('note-loads').innerHTML =
      `The dominant peak is <strong>peak ${domLabel}</strong> at <strong>${domVal} kW</strong>. It is larger than peak ${othLabel} (<strong>${othVal} kW</strong>). The borefield will be sized to meet this demand.`;

    // ── Card 3: Borehole Capacity ──
    const shape  = d.footprint_shape || payload.footprint_shape || 'elongated';
    const floors = d.num_floors || payload.num_floors || 1;
    const area   = d.floor_area_m2 || payload.floor_area_m2;
    const fpM2   = area && floors ? Math.round(area / floors) : null;
    const sl     = shapeLabel[shape] || 'Standard';
    const areaStr = fpM2 ? `, ~${fpM2} m²` : '';

    document.getElementById('r-cap-shape').textContent = `${sl}${areaStr}, ${floors} floor(s)`;

    const nbMin = d.nb_min, nbMax = d.nb_max, nbHint = d.n_boreholes_hint;
    document.getElementById('r-cap-range').textContent =
      nbMin != null && nbMax != null
        ? `${nbMin}–${nbMax} boreholes fit at 6 m spacing`
        : nbHint != null ? `${nbHint} boreholes at 6 m spacing` : '—';

    document.getElementById('note-cap').innerHTML =
      `<strong>${sl}</strong> footprint and <strong>${floors} floor(s)</strong> come from your building inputs on the previous page — not model estimates. ` +
      (nbMin != null && nbMax != null
        ? `The range <strong>${nbMin}–${nbMax} boreholes</strong> reflects how many vertical loops physically fit in your building footprint at 6 m center-to-center spacing.`
        : 'Borehole count will be refined in the sizing step.');

    // show results
    document.getElementById('results-state').style.display = '';
    document.getElementById('loading-state').style.display  = 'none';
    initExpand('btn-soil',  'panel-soil');
    initExpand('btn-loads', 'panel-loads');
    initExpand('btn-cap',   'panel-cap');
    initSpecularButton();

  } catch (err) {
    document.getElementById('loading-state').style.display = 'none';
    const el = document.getElementById('error-state');
    const msg = err.message || 'Could not reach the analysis server. Make sure you are running GeoLoop locally.';
    el.textContent = 'Analysis failed: ' + msg + '. Please go back and try again.';
    el.style.display = '';
  }
})();

function goNext() {
  const d = JSON.parse(sessionStorage.getItem('gl_result1') || '{}');
  sessionStorage.setItem('gl_qh',      d.q_h      || '');
  sessionStorage.setItem('gl_qc',      d.q_c      || '');
  sessionStorage.setItem('gl_nb_hint', d.n_boreholes_hint || '');
  window.location.href = 'stage2.html';
}

// ── SpecularButton ──
function initSpecularButton() {
  const btn = document.getElementById('continue-btn');
  if (!btn) return;
  const PAD=20, DPR=Math.min(window.devicePixelRatio||1, 2);
  const RADIUS=100, LINE_COL='#7a6a5a', BASE_COL='#c4a882', INTENSITY=1, SHINE_SZ=10, SHINE_FD=40, THICKNESS=1, SPEED=0.35, PROXIMITY=220;
  const fx=document.createElement('span'); fx.className='sb-fx'; btn.insertBefore(fx,btn.firstChild);
  const cv=document.createElement('canvas'); Object.assign(cv.style,{display:'block',width:'100%',height:'100%'}); fx.appendChild(cv);
  const gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true}); if(!gl) return;
  gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  const V=`#version 300 es\nin vec2 p;\nvoid main(){gl_Position=vec4(p,0,1);}`;
  const F=`#version 300 es
precision highp float;
uniform vec2 uC,uH; uniform float uR,uA,uPx,uI,uSS,uSF,uT,uBW; uniform vec3 uLC,uBC; out vec4 o;
float sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float gL(float d,float s){float x=d/(s+1e-6);float k=mix(1.,1.6,smoothstep(0.,1.5,x));return exp(-k*x*x);}
void main(){vec2 p=gl_FragCoord.xy-uC;float d=sdRR(p,uH,uR);vec2 L=vec2(cos(uA),sin(uA));float base=(1.-smoothstep(0.,uBW,abs(d)))*.45;vec2 n=normalize(p/(uH*uH)+1e-6);float phi=acos(clamp(abs(dot(n,L)),0.,1.));float rim=1.-smoothstep(uSS-uSF,uSS+uSF+1e-4,phi);float line=gL(d,uT);float ec=1.-smoothstep(.5*uPx,3.*uPx,abs(d));float hi=line*rim*ec*uI;vec3 col=uBC*base+uLC*hi;o=vec4(col,clamp(base+hi,0.,1.));}`;
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
  const pr=gl.createProgram(); gl.attachShader(pr,mk(gl.VERTEX_SHADER,V)); gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,F)); gl.linkProgram(pr); gl.useProgram(pr);
