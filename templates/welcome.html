<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoLoop — Geothermal Loop Sizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #faf7f2;
      --border: #e5ddd4;
      --text:   #1a1209;
      --muted:  #7a6a5a;
      --faint:  #a89a8a;
      --font:   'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Nav ── */
    .nav {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(250,247,242,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }
    .nav-back { font-size:13px; color:var(--muted); background:none; border:none; cursor:pointer; font-family:var(--font); padding:4px 8px; }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .nav-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      padding: 0 28px;
    }

    /* ── Hero: children are absolutely placed within this column ── */
    .hero {
      flex: 1;
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }

    /* ── Circle: center at 1/3 from top ── */
    .illustration {
      position: absolute;
      top: 27%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 0;
      animation: illustAppear 1.88s ease-out both;
    }
    @keyframes illustAppear {
      from { opacity: 0; transform: translate(-50%, -44%); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* ── Text block: starts just below illustration ── */
    .hero-text {
      position: absolute;
      top: 43%;
      left: 0;
      right: 0;
      text-align: center;
    }

    /* ── Particle text heading ── */
    #particle-text-wrap {
      width: 100%;
      height: 116px;
      position: relative;
      margin-bottom: 14px;
      touch-action: none;
    }
    #particle-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Body text ── */
    .tagline {
      font-size: clamp(13px, 3.6vw, 15px);
      color: var(--muted);
      line-height: 1.68;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .designed-for {
      font-size: clamp(10px, 2.6vw, 11px);
      font-weight: 300;
      font-style: italic;
      color: var(--faint);
      letter-spacing: 0.02em;
    }

    /* ── Button: anchored to bottom ── */
    .btn-row {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .account-link { background:none; border:none; font-family:var(--font); font-size:13px; color:var(--muted); cursor:pointer; padding:4px; text-decoration:underline; text-underline-offset:3px; }

    /* ── SpecularButton shell ── */
    #spec-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: visible;
      isolation: isolate;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.01em;
      line-height: 1;
      padding: 11px 28px;
      min-width: 124px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    #spec-btn:active  { transform: scale(0.97); }
    #spec-btn:focus-visible { outline: 2px solid rgba(26,18,9,0.3); outline-offset: 3px; }
    #spec-btn .sb-fx {
      position: absolute;
      inset: -20px;
      pointer-events: none;
      z-index: 1;
    }
    #spec-btn .sb-fx canvas { display: block; width: 100%; height: 100%; }
    #spec-btn .sb-label { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 8px; }
    .sb-arrow { font-size: 15px; display: inline-block; transition: transform 0.2s; }
    #spec-btn:hover .sb-arrow { transform: translateX(4px); }

    @media (min-width: 640px) {
      .nav { padding: 0 32px; height: 56px; }
      .main { padding: 0 40px; }
      .hero { max-width: 420px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="#">
      <svg width="22" height="20" viewBox="0 0 22 20" fill="none" aria-hidden="true">
        <rect x="0"  y="0"  width="9"  height="3"  rx="0.5" fill="#1a1209"/>
        <rect x="13" y="0"  width="9"  height="3"  rx="0.5" fill="#1a1209"/>
        <rect x="0"  y="5"  width="9"  height="3"  rx="0.5" fill="#374151"/>
        <rect x="13" y="5"  width="9"  height="3"  rx="0.5" fill="#374151"/>
        <rect x="0"  y="10" width="9"  height="3"  rx="0.5" fill="#6b7280"/>
        <rect x="13" y="10" width="9"  height="3"  rx="0.5" fill="#6b7280"/>
        <rect x="0"  y="15" width="9"  height="3"  rx="0.5" fill="#9ca3af"/>
        <rect x="13" y="15" width="9"  height="3"  rx="0.5" fill="#9ca3af"/>
        <rect x="10" y="0"  width="2"  height="20" rx="0.5" fill="#1a1209"/>
      </svg>
      <span class="nav-name">GeoLoop</span>
    </a>
    <button class="nav-back" onclick="history.back()">Back</button>
  </nav>

  <main class="main">
    <div class="hero">

      <div class="illustration" aria-hidden="true">
        <img src="static/illustrations/illus1_transparent.png" width="330" style="display:block;">
      </div>

      <div class="hero-text">
        <div id="particle-text-wrap" aria-label="Hello there">
          <canvas id="particle-canvas" aria-hidden="true"></canvas>
        </div>

        <p class="tagline">
          Enter your ZIP code and building type.<br>
          Get a geothermal borefield size and cost<br>
          estimate in under 10 seconds.
        </p>

        <p class="designed-for">Designed for Commercial Building Owners</p>
      </div>

      <div class="btn-row">
        <button id="spec-btn" onclick="window.location.href='onboarding_1.html'">
          <span class="sb-label">
            Let's go
            <span class="sb-arrow">→</span>
          </span>
        </button>
        <button class="account-link" onclick="window.location.href='signup.html?mode=login'">Already have an account?</button>
      </div>

    </div>
  </main>

  <script>
  // ─────────────────────────────────────────────────────────
  // ParticleText — vanilla JS port of ReactBits component
  // Faithful port: same sampling, easing, repel, drift, color mix
  // ─────────────────────────────────────────────────────────
  (function () {
    const container = document.getElementById('particle-text-wrap');
    const canvas    = document.getElementById('particle-canvas');
    if (!container || !canvas) return;
    const ctx = canvas.getContext('2d');

    const TEXT        = 'Hello there';
    const P_SIZE      = 2.2;
    const DENSITY     = 2;           // denser sampling → more dots, "there" legible
    const COLOR       = '#0a0a0a';
    const HIGHLIGHT   = '#0a0a0a';
    const SCATTER     = 160;
    const GATHER_DUR  = 1500;
    const STAGGER     = 380;
    const REPEL       = 35;
    const REPEL_R     = 90;
    const DRIFT       = 0.5;
    const FONT_WEIGHT = 800;
    const FONT_FAMILY = "'Sora', sans-serif";

    const hexToRgb = h => { const c = h.replace('#',''); return { r:parseInt(c.slice(0,2),16), g:parseInt(c.slice(2,4),16), b:parseInt(c.slice(4,6),16) }; };
    const mixRgb   = (a, b, t) => ({ r:Math.round(a.r+(b.r-a.r)*t), g:Math.round(a.g+(b.g-a.g)*t), b:Math.round(a.b+(b.b-a.b)*t) });
    const rgbCss   = c => `rgb(${c.r},${c.g},${c.b})`;
    const clamp    = (v,a,b) => Math.min(Math.max(v,a),b);
    const easeOut3 = t => 1 - Math.pow(1-t, 3);

    let particles=[], animId=null, buildId=0, gathering=false, gatherStart=0;
    let W=0, H=0;
    const ptr = { active:false, x:0, y:0, sx:0, sy:0 };

    const startGather = () => {
      if (!particles.length) return;
      const now = performance.now();
      particles.forEach(p => {
        const ang = p.seed * Math.PI * 2, d = SCATTER * (0.35 + p.depth * 0.75);
        p.x = p.tx + Math.cos(ang)*d + (p.depth-0.5)*SCATTER*0.55;
        p.y = p.ty + Math.sin(ang)*d + (p.seed -0.5)*SCATTER*0.55;
        p.sx = p.x; p.sy = p.y;
        p.delay = p.seed * STAGGER;
      });
      gatherStart = now; gathering = true;
    };

    const render = now => {
      ctx.clearRect(0, 0, W, H);
      ptr.sx += (ptr.x - ptr.sx) * 0.18;
      ptr.sy += (ptr.y - ptr.sy) * 0.18;
      let done = true;
      particles.forEach(p => {
        let bx = p.tx, by = p.ty, prog = 1;
        if (gathering) {
          const loc = (now - gatherStart - p.delay) / Math.max(1, GATHER_DUR);
          prog = clamp(loc, 0, 1);
          const e = easeOut3(prog);
          bx = p.sx + (p.tx - p.sx)*e;
          by = p.sy + (p.ty - p.sy)*e;
          if (prog < 1) done = false;
        } else {
          const t = now * 0.001;
          bx += Math.sin(t*0.9 + p.seed*10) * DRIFT * p.depth;
          by += Math.cos(t*0.75+ p.depth*10) * DRIFT * p.depth;
        }
        if (ptr.active) {
          const dx = bx-ptr.sx, dy = by-ptr.sy, dist = Math.hypot(dx,dy);
          if (dist > 0 && dist < REPEL_R) {
            const f = Math.pow(1-dist/REPEL_R, 2) * REPEL;
            bx += (dx/dist)*f; by += (dy/dist)*f;
          }
        }
        p.x += (bx - p.x) * 0.22;
        p.y += (by - p.y) * 0.22;
        ctx.globalAlpha = clamp(0.35 + prog*0.65, 0, 1);
        ctx.fillStyle = p.color;
        const sz = p.size;
        if (sz <= 2.1) ctx.fillRect(p.x-sz/2, p.y-sz/2, sz, sz);
        else { ctx.beginPath(); ctx.arc(p.x, p.y, sz/2, 0, Math.PI*2); ctx.fill(); }
      });
      ctx.globalAlpha = 1;
      if (gathering && done) gathering = false;
      animId = requestAnimationFrame(render);
    };

    const sample = async () => {
      const bid = ++buildId;
      const rect = container.getBoundingClientRect();
      W = Math.floor(rect.width); H = Math.floor(rect.height);
      if (W <= 0 || H <= 0) return;
      const dpr = Math.min(window.devicePixelRatio||1, 2);
      canvas.width  = Math.max(1, Math.floor(W*dpr));
      canvas.height = Math.max(1, Math.floor(H*dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // resolve clamp() font size via probe element
      const probe = document.createElement('span');
      probe.style.cssText = `position:absolute;visibility:hidden;pointer-events:none;font-size:clamp(46px,13vw,62px);font-weight:${FONT_WEIGHT};font-family:${FONT_FAMILY}`;
      document.body.appendChild(probe);
      const fs = parseFloat(getComputedStyle(probe).fontSize) || 52;
      probe.remove();

      await document.fonts.ready;
      if (bid !== buildId) return;

      const font = `${FONT_WEIGHT} ${fs}px ${FONT_FAMILY}`;
      const off = document.createElement('canvas');
      const oc  = off.getContext('2d', { willReadFrequently:true });
      oc.font = font;
      const m  = oc.measureText(TEXT);
      const l  = Math.ceil(m.actualBoundingBoxLeft  || 0);
      const r  = Math.ceil(m.actualBoundingBoxRight || m.width);
      const as = Math.ceil(m.actualBoundingBoxAscent  || fs*0.78);
      const ds = Math.ceil(m.actualBoundingBoxDescent || fs*0.22);
      const pd = Math.max(12, Math.ceil(fs*0.08));
      off.width  = l+r + pd*2;
      off.height = as+ds + pd*2;
      oc.clearRect(0, 0, off.width, off.height);
      oc.font = font;
      oc.textAlign = 'left'; oc.textBaseline = 'alphabetic';
      oc.fillStyle = '#fff';
      oc.fillText(TEXT, pd-l, pd+as);

      const data = oc.getImageData(0,0,off.width,off.height).data;
      const targets = [];
      const step = Math.max(2, Math.floor(DENSITY));
      for (let y=0; y<off.height; y+=step)
        for (let x=0; x<off.width; x+=step)
          if (data[(y*off.width+x)*4+3] > 40)
            targets.push({ x: W/2-off.width/2+x, y: H/2-off.height/2+y, alpha: data[(y*off.width+x)*4+3]/255 });

      const maxP = Math.max(900, Math.min(5200, Math.floor((W*H)/90)));
      const stride = Math.max(1, Math.ceil(targets.length/maxP));
      const baseRgb = hexToRgb(COLOR), hiRgb = hexToRgb(HIGHLIGHT);
      particles = targets.filter((_,i)=>i%stride===0).map((t,i)=>{
        const seed  = ((i*9301+49297)%233280)/233280;
        const depth = 0.45 + (((i*233+97)%1000)/1000)*0.9;
        const blend = clamp(t.x/Math.max(1,W) + (seed-0.5)*0.35, 0, 1);
        const color = rgbCss(mixRgb(baseRgb, hiRgb, blend));
        const ang = seed*Math.PI*2, d = SCATTER*(0.35+depth*0.75);
        const sx = t.x+Math.cos(ang)*d+(seed-0.5)*SCATTER*0.45;
        const sy = t.y+Math.sin(ang)*d+(depth-0.9)*SCATTER*0.45;
        return { x:sx, y:sy, sx, sy, tx:t.x, ty:t.y, size:Math.max(0.6,P_SIZE*(0.75+t.alpha*0.45)), color, seed, depth, delay:seed*STAGGER };
      });

      ptr.x=W/2; ptr.y=H/2; ptr.sx=ptr.x; ptr.sy=ptr.y;
      startGather();
      if (animId===null) animId = requestAnimationFrame(render);
    };

    canvas.addEventListener('pointermove', e => {
      const r=canvas.getBoundingClientRect(); ptr.x=e.clientX-r.left; ptr.y=e.clientY-r.top; ptr.active=true;
    });
    canvas.addEventListener('pointerleave', ()=>{ ptr.active=false; });

    let rszId;
    new ResizeObserver(()=>{ cancelAnimationFrame(rszId); rszId=requestAnimationFrame(sample); }).observe(container);
    document.fonts.ready.then(sample);
  })();


  // ─────────────────────────────────────────────────────────
  // SpecularButton — vanilla WebGL2 port of ReactBits component
  // ─────────────────────────────────────────────────────────
  (function () {
    const btn = document.getElementById('spec-btn');
    const PAD = 20, DPR = Math.min(window.devicePixelRatio||1, 2);
    const RADIUS=100, LINE_COL='#7a6a5a', BASE_COL='#c4a882';
    const INTENSITY=1, SHINE_SZ=10, SHINE_FD=40, THICKNESS=1, SPEED=0.35, PROXIMITY=250;

    const fx = document.createElement('span');
    fx.className = 'sb-fx';
    btn.insertBefore(fx, btn.firstChild);
    const canvas = document.createElement('canvas');
    Object.assign(canvas.style, { display:'block', width:'100%', height:'100%' });
    fx.appendChild(canvas);

    const gl = canvas.getContext('webgl2', { alpha:true, premultipliedAlpha:true, antialias:true });
    if (!gl) return;
    gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

    const VERT=`#version 300 es\nin vec2 position;\nvoid main(){gl_Position=vec4(position,0.0,1.0);}`;
    const FRAG=`#version 300 es
precision highp float;
uniform vec2 uCenter,uHalfSize;
uniform float uRadius,uAngle,uPx,uIntensity,uShineSize,uShineFade,uThickness,uBaseWidth;
uniform vec3 uLineColor,uBaseColor;
out vec4 fragColor;
float sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
float gL(float d,float s){float x=d/(s+1e-6);float k=mix(1.0,1.6,smoothstep(0.0,1.5,x));return exp(-k*x*x);}
void main(){
  vec2 p=gl_FragCoord.xy-uCenter;
  float d=sdRR(p,uHalfSize,uRadius);
  vec2 L=vec2(cos(uAngle),sin(uAngle));
  float base=(1.0-smoothstep(0.0,uBaseWidth,abs(d)))*0.45;
  vec2 n=normalize(p/(uHalfSize*uHalfSize)+1e-6);
  float phi=acos(clamp(abs(dot(n,L)),0.0,1.0));
  float rim=1.0-smoothstep(uShineSize-uShineFade,uShineSize+uShineFade+1e-4,phi);
  float line=gL(d,uThickness);
  float ec=1.0-smoothstep(0.5*uPx,3.0*uPx,abs(d));
  float hi=line*rim*ec*uIntensity;
  vec3 col=uBaseColor*base+uLineColor*hi;
  fragColor=vec4(col,clamp(base+hi,0.0,1.0));
}`;

    const mk=(t,s)=>{ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh); return sh; };
    const prog=gl.createProgram();
    gl.attachShader(prog,mk(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(prog); gl.useProgram(prog);
    const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
    const pl=gl.getAttribLocation(prog,'position'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
    const U=Object.fromEntries(['uCenter','uHalfSize','uRadius','uAngle','uPx','uLineColor','uBaseColor','uIntensity','uShineSize','uShineFade','uThickness','uBaseWidth'].map(n=>[n,gl.getUniformLocation(prog,n)]));
    const h2r=h=>{const c=h.replace('#','');return[parseInt(c.slice(0,2),16)/255,parseInt(c.slice(2,4),16)/255,parseInt(c.slice(4,6),16)/255];};

    let W=1,H=1;
    const resize=()=>{const r=btn.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round((W+PAD*2)*DPR);canvas.height=Math.round((H+PAD*2)*DPR);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2fv(U.uCenter,[(PAD+W/2)*DPR,(PAD+H/2)*DPR]);gl.uniform2fv(U.uHalfSize,[(W/2)*DPR,(H/2)*DPR]);};
    new ResizeObserver(resize).observe(btn); resize();

    let pAngle=null, proxT=0;
    window.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();const cx=r.left+W/2,cy=r.top+H/2;const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);const dist=Math.hypot(dx,dy);pAngle=dist===0?Math.atan2(2/H,-2/W)+((e.clientX-cx)/(W/2))*0.3+((cy-e.clientY)/(H/2))*0.15:Math.atan2(cy-e.clientY,e.clientX-cx);proxT=Math.pow(Math.max(0,1-dist/PROXIMITY),2)*(3-2*Math.max(0,1-dist/PROXIMITY));});

    const lRGB=h2r(LINE_COL), bRGB=h2r(BASE_COL);
    let angle=2.4, idle=2.4, bright=0, last=performance.now();
    (function frame(now){
      const dt=Math.min((now-last)/1000,0.05); last=now;
      idle+=SPEED*dt;
      const diff=((( pAngle!==null?pAngle:idle)-angle+Math.PI*3)%(Math.PI*2))-Math.PI;
      angle+=diff*(1-Math.exp(-dt*7));
      bright+=(proxT-bright)*(1-Math.exp(-dt*8));
      const r=Math.min(RADIUS,Math.min(W,H)/2);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(U.uAngle,angle); gl.uniform1f(U.uRadius,r*DPR); gl.uniform1f(U.uPx,DPR);
      gl.uniform3fv(U.uLineColor,lRGB); gl.uniform3fv(U.uBaseColor,bRGB);
      gl.uniform1f(U.uIntensity,INTENSITY*bright); gl.uniform1f(U.uShineSize,(SHINE_SZ*Math.PI)/180);
      gl.uniform1f(U.uShineFade,(SHINE_FD*Math.PI)/180); gl.uniform1f(U.uThickness,THICKNESS*DPR); gl.uniform1f(U.uBaseWidth,DPR);
      gl.drawArrays(gl.TRIANGLES,0,3);
      requestAnimationFrame(frame);
    })(performance.now());
  })();
  </script>

</body>
</html>
