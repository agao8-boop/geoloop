<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoLoop — My Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <link rel="stylesheet" href="/static/pilnav.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #f5f3f0;
      --border: #dddbd7;
      --text:   #1a1814;
      --muted:  #7a7570;
      --faint:  #a09c97;
      --font:   'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body { height: 100%; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%; padding-top:56px; padding-bottom:env(safe-area-inset-bottom); }
    .gl-waves-bg { position:fixed; inset:0; z-index:-1; pointer-events:none; }

    .main { flex:1; padding:32px 24px 40px; max-width:540px; margin:0 auto; width:100%; }

    .user-row { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
    .avatar { width:44px; height:44px; border-radius:50%; background:var(--text); color:var(--bg); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; flex-shrink:0; }
    .user-info {}
    .user-name  { font-size:17px; font-weight:700; letter-spacing:-0.02em; }
    .user-email { font-size:12px; color:var(--muted); margin-top:1px; }

    .section-label { font-size:11px; font-weight:600; color:var(--faint); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:14px; }

    .empty-state { text-align:center; padding:48px 0; color:var(--muted); }
    .empty-state p { font-size:14px; line-height:1.6; }

    .project-list { display:flex; flex-direction:column; gap:10px; margin-bottom:28px; }

    /* Project row — no card border, row-style with dividers */
    .project-card {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 14px 0;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .project-list > .project-card:first-child { border-top: 1px solid var(--border); }
    .project-card:hover { opacity: 0.72; }
    .project-card:active { opacity: 0.5; }

    .project-icon { display: none; } /* Remove icon — not needed */
    .project-body { flex: 1; min-width: 0; }
    .project-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .project-delete { background:none; border:none; cursor:pointer; padding:4px 6px; color:var(--faint); font-size:16px; line-height:1; border-radius:6px; transition:color 0.15s; flex-shrink:0; }
    .project-delete:hover { color:#e05c4a; }

    /* Score badge — color-coded text, no border */
    .project-score { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .project-score-num { font-size: 20px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .score-excellent { color: #3478d4; }
    .score-good      { color: #348a48; }
    .score-fair      { color: #b46824; }
    .score-poor      { color: #b03838; }
    .project-score-grade { font-size: 11px; color: var(--muted); }
    .project-score-arrow { font-size: 13px; color: var(--faint); margin-left: 2px; }

    .new-btn { width:100%; font-family:var(--font); font-size:15px; font-weight:700; background:var(--text); color:#f5f3f0; border:none; border-radius:100px; padding:14px; cursor:pointer; transition:opacity 0.15s; }
    .new-btn:active { opacity:0.8; }

    .confirm-overlay { display:none; position:fixed; inset:0; background:rgba(26,24,20,0.4); z-index:100; align-items:center; justify-content:center; padding:24px; }
    .confirm-overlay.show { display:flex; }
    .confirm-box { background:white; border-radius:18px; padding:24px; max-width:320px; width:100%; }
    .confirm-title { font-size:16px; font-weight:700; margin-bottom:8px; }
    .confirm-sub   { font-size:13px; color:var(--muted); margin-bottom:20px; line-height:1.5; }
    .confirm-btns  { display:flex; gap:10px; }
    .confirm-cancel { flex:1; font-family:var(--font); font-size:14px; font-weight:600; background:var(--bg); color:var(--text); border:1.5px solid var(--border); border-radius:100px; padding:11px; cursor:pointer; }
    .confirm-delete { flex:1; font-family:var(--font); font-size:14px; font-weight:600; background:#e05c4a; color:white; border:none; border-radius:100px; padding:11px; cursor:pointer; }
  </style>
</head>
<body>
<div class="gl-waves-bg"></div>

<header class="gl-nav-header">
  <nav class="gl-pill-nav" aria-label="Primary">
    <a class="gl-pill-logo" href="/" aria-label="Home">
      <svg width="20" height="18" viewBox="0 0 22 20" fill="none" aria-hidden="true">
        <rect x="0"  y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="13" y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="0"  y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="13" y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="0"  y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="0"  y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="13" y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="10" y="0"  width="2"  height="20" rx="0.5" fill="rgba(255,255,255,1)"/>
      </svg>
    </a>
    <div class="gl-pill-nav-items">
      <ul class="gl-pill-list" role="menubar">
        <li role="none"><a role="menuitem" href="/welcome.html" class="gl-pill-btn"><span class="gl-hover-circle" aria-hidden="true"></span><span class="gl-label-stack"><span class="gl-pill-label">GeoLoop</span><span class="gl-pill-label-hover" aria-hidden="true">GeoLoop</span></span></a></li>
        <li role="none"><a role="menuitem" href="/account.html" class="gl-pill-btn"><span class="gl-hover-circle" aria-hidden="true"></span><span class="gl-label-stack"><span class="gl-pill-label">Home</span><span class="gl-pill-label-hover" aria-hidden="true">Home</span></span></a></li>
        <li role="none"><a role="menuitem" href="/contact.html" class="gl-pill-btn"><span class="gl-hover-circle" aria-hidden="true"></span><span class="gl-label-stack"><span class="gl-pill-label">Contact</span><span class="gl-pill-label-hover" aria-hidden="true">Contact</span></span></a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="main" id="main-content">

  <div class="user-row">
    <div class="avatar" id="avatar-initials"></div>
    <div class="user-info">
      <div class="user-name" id="user-name-display"></div>
      <div class="user-email" id="user-email-display"></div>
    </div>
  </div>

  <div class="section-label">Saved projects</div>
  <p style="font-size:11px;color:var(--faint);margin-bottom:14px;line-height:1.5;">Projects are saved on this device. To access them on another device, export from the report page.</p>

  <div id="project-list-container"></div>

  <button class="new-btn" onclick="window.location.href='welcome.html'">+ Start new analysis</button>

</main>

<!-- Delete confirm overlay -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title">Delete project?</div>
    <p class="confirm-sub">This can't be undone.</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-delete" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
let pendingDeleteId = null;

function init() {
  let user = null;
  try { user = JSON.parse(localStorage.getItem('gl_current_user') || 'null'); } catch (_) {}
  if (!user) { window.location.href = 'signup.html'; return; }

  // Keep a malformed or partially populated local profile from leaving a
  // completely blank account page on mobile Safari.
  user.name = String(user.name || 'GeoLoop user');
  user.email = String(user.email || '');

  // Populate user info
  document.getElementById('user-name-display').textContent = user.name;
  document.getElementById('user-email-display').textContent = user.email;
  const initials = user.name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('avatar-initials').textContent = initials;

  renderProjects(user);
  document.getElementById('main-content').style.display = '';
}

function renderProjects(user) {
  let projects = [];
  try {
    const stored = JSON.parse(localStorage.getItem('gl_projects_' + user.email) || '[]');
    projects = Array.isArray(stored) ? stored : [];
  } catch (_) {}
  const container = document.getElementById('project-list-container');

  if (!projects.length) {
    container.innerHTML = `<div class="empty-state"><p>No saved projects yet.<br>Run an analysis and save it to see it here.</p></div>`;
    return;
  }

  const list = document.createElement('div');
  list.className = 'project-list';

  projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';

    const date = new Date(p.savedAt);
    const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const metaParts = [p.zip, p.building_type, p.NB ? `${p.NB} boreholes` : null].filter(Boolean);

    const score = p.score || null;
    const grade = p.grade || null;
    const gradeColor = { Excellent: 'score-excellent', Good: 'score-good', Fair: 'score-fair', Poor: 'score-poor' };
    const scoreCls = gradeColor[grade] || 'score-fair';
    const scoreHtml = score != null
      ? `<div class="project-score">
           <span class="project-score-num ${scoreCls}">${score}</span>
           <span class="project-score-grade">${grade || ''} ›</span>
         </div>`
      : '';
    card.innerHTML = `
      <div class="project-body">
        <div class="project-name">${escHtml(p.name)}</div>
        <div class="project-meta">${dateStr}${metaParts.length ? ' · ' + metaParts.map(escHtml).join(' · ') : ''}</div>
      </div>
      ${scoreHtml}
      <button class="project-delete" title="Delete" onclick="event.stopPropagation(); askDelete('${escHtml(p.id)}')">×</button>
    `;
    card.addEventListener('click', () => openProject(p));
    list.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(list);
}

function openProject(p) {
  sessionStorage.clear();
  if (p.snapshot && typeof p.snapshot === 'object') {
    Object.entries(p.snapshot).forEach(([key, value]) => sessionStorage.setItem(key, value));
  }
  window.location.href = 'result_report.html';
}

function askDelete(id) {
  pendingDeleteId = id;
  document.getElementById('confirm-overlay').classList.add('show');
}
function closeConfirm() {
  pendingDeleteId = null;
  document.getElementById('confirm-overlay').classList.remove('show');
}
function confirmDelete() {
  const user = JSON.parse(localStorage.getItem('gl_current_user') || 'null');
  if (!user || !pendingDeleteId) { closeConfirm(); return; }
  const key = 'gl_projects_' + user.email;
  const projects = JSON.parse(localStorage.getItem(key) || '[]');
  localStorage.setItem(key, JSON.stringify(projects.filter(p => p.id !== pendingDeleteId)));
  closeConfirm();
  renderProjects(user);
}

function signOut() {
  localStorage.removeItem('gl_current_user');
  window.location.href = 'welcome.html';
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
<script src="/static/pilnav.js"></script>
<script src="/static/gradient-waves.js"></script>
</body>
</html>
