<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoLoop — Who's asking?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <link rel="stylesheet" href="/static/pilnav.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f2f0ed;   /* cooler neutral, distinct from welcome cream */
      --border:    #dddbd7;
      --text:      #1e1c1a;
      --muted:     #6b6560;
      --faint:     #9c9690;
      --pill-bg:   #e8e5e0;
      --pill-text: #4a4540;
      --sel-bg:    #2c2a27;
      --sel-text:  #f5f3ef;
      --font:      'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Nav ── */

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      padding: 0 28px;
    }

    /* ── Hero: same absolute-position pattern as welcome ── */
    .hero {
      flex: 1;
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }

    /* ── Circle: center at 1/3 ── */
    .illustration {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);
      line-height: 0;
    }

    /* ── Content: starts at ~38% to give pills room above fixed btn-row ── */
    .hero-content {
      position: absolute;
      top: 38%;
      left: 0;
      right: 0;
      text-align: center;
      padding-bottom: 100px;
    }

    .page-title {
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: clamp(12px, 3.2vw, 14px);
      color: var(--muted);
      line-height: 1.6;
      font-weight: 400;
      margin-bottom: 20px;
    }

    /* ── Persona pills ── */
    .pill-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
    }

    .pill {
      padding: 8px 15px;
      border-radius: 100px;
      background: var(--pill-bg);
      color: var(--pill-text);
      font-family: var(--font);
      font-size: clamp(12px, 3vw, 13px);
      font-weight: 500;
      letter-spacing: 0.01em;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      outline: none;
      user-select: none;
    }
    .pill:hover    { background: #d8d4cf; }
    .pill.selected { background: var(--sel-bg); color: var(--sel-text); }
    .pill:active   { transform: scale(0.96); }

    /* ── Next button: anchored to bottom, same spec as welcome ── */
    .btn-row {
      position: absolute;
      bottom: 36px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      overflow: visible; isolation: isolate; background: transparent; color: var(--text);
      font-family: var(--font); font-weight: 700; font-size: 1rem; letter-spacing: 0.01em;
      line-height: 1; padding: 11px 20px; border-radius: 100px; border: none; cursor: pointer;
      outline: none; -webkit-tap-highlight-color: transparent; transition: transform 0.15s ease;
    }
    .back-btn:active { transform: scale(0.97); }
    .back-btn .sb-fx { position: absolute; inset: -20px; pointer-events: none; z-index: 1; }
    .back-btn .sb-fx canvas { display: block; width: 100%; height: 100%; }
    .back-btn .sb-label { position: relative; z-index: 2; white-space: nowrap; }

    /* ── SpecularButton shell ── */
    #spec-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: visible;
      isolation: isolate;
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.01em;
      line-height: 1;
      padding: 11px 28px;
      min-width: 124px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    #spec-btn:active  { transform: scale(0.97); }
    #spec-btn:focus-visible { outline: 2px solid rgba(30,28,26,0.3); outline-offset: 3px; }
    #spec-btn .sb-fx { position:absolute; inset:-20px; pointer-events:none; z-index:1; }
    #spec-btn .sb-fx canvas { display:block; width:100%; height:100%; }
    #spec-btn .sb-label { position:relative; z-index:2; display:inline-flex; align-items:center; gap:8px; }
    .sb-arrow { font-size:15px; display:inline-block; transition:transform 0.2s; }
    #spec-btn:hover .sb-arrow { transform: translateX(4px); }

    @media (min-width: 640px) {
      .main { padding: 0 40px; }
      .hero { max-width: 420px; }
    }
  </style>
</head>
<body>

  <header class="gl-nav-header">
  <ul class="gl-pill-list" id="gl-pill-nav">
    <li class="gl-pill gl-pill-logo" aria-label="GeoLoop">
      <svg width="20" height="18" viewBox="0 0 22 20" fill="none" aria-hidden="true">
        <rect x="0"  y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="13" y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="0"  y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="13" y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="0"  y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="0"  y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="13" y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="10" y="0"  width="2"  height="20" rx="0.5" fill="rgba(255,255,255,1)"/>
      </svg>
    </li>
    <li class="gl-pill gl-pill-text" data-href="units.html" data-label="GeoLoop">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">GeoLoop</span><span class="gl-pill-label-hover">GeoLoop</span></div>
    </li>
    <li class="gl-pill gl-pill-text" data-href="account.html" data-label="Home">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">Home</span><span class="gl-pill-label-hover">Home</span></div>
    </li>
    <li class="gl-pill gl-pill-text" data-href="contact.html" data-label="Contact">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">Contact</span><span class="gl-pill-label-hover">Contact</span></div>
    </li>
  </ul>
</header>

  <main class="main">
    <div class="hero">

      <div class="illustration" aria-hidden="true">
        <img src="static/illustrations/illus3_transparent.png" width="270" style="display:block;">
      </div>

      <div class="hero-content">
        <h1 class="page-title">Who's asking?</h1>
        <p class="page-sub">Pick the role that best fits.<br>It helps us tailor your results.</p>

        <div class="pill-grid" id="pillGrid" role="group" aria-label="Select your role">
          <button class="pill" data-role="building-owner">Building Owner</button>
          <button class="pill" data-role="developer">Property Developer</button>
          <button class="pill" data-role="mep-engineer">MEP Engineer</button>
          <button class="pill" data-role="architect">Architect</button>
          <button class="pill" data-role="energy-manager">Energy Manager</button>
          <button class="pill" data-role="sustainability-lead">Sustainability Lead</button>
          <button class="pill" data-role="facility-manager">Facility Manager</button>
          <button class="pill" data-role="contractor">Geothermal Contractor</button>
          <button class="pill" data-role="other">Other</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="back-btn" onclick="history.back()"><span class="sb-label">‹ Back</span></button>
        <button id="spec-btn" onclick="goNext()">
          <span class="sb-label">
            Next
            <span class="sb-arrow">›</span>
          </span>
        </button>
      </div>

    </div>
  </main>

  <script>
  // ── Pill toggle ──
  document.getElementById('pillGrid').addEventListener('click', e => {
    const pill = e.target.closest('.pill');
    if (!pill) return;
    // allow multi-select — toggle this pill
    pill.classList.toggle('selected');
  });

  function goNext() {
    const selected = [...document.querySelectorAll('.pill.selected')].map(p => p.dataset.role);
    // store for later steps and navigate
    if (selected.length) sessionStorage.setItem('gl_roles', JSON.stringify(selected));
    window.location.href = 'units.html';
  }


  // ─────────────────────────────────────────────────────────
  // SpecularButton — vanilla WebGL2
  // ─────────────────────────────────────────────────────────
  (function () {
    const btn = document.getElementById('spec-btn');
    const PAD=20, DPR=Math.min(window.devicePixelRatio||1, 2);
    const RADIUS=100, LINE_COL='#6b6560', BASE_COL='#b5b0aa';
    const INTENSITY=1, SHINE_SZ=10, SHINE_FD=40, THICKNESS=1, SPEED=0.35, PROXIMITY=250;

    const fx=document.createElement('span'); fx.className='sb-fx'; btn.insertBefore(fx,btn.firstChild);
    const canvas=document.createElement('canvas'); Object.assign(canvas.style,{display:'block',width:'100%',height:'100%'}); fx.appendChild(canvas);
    const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true});
    if(!gl) return;
    gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

    const VERT=`#version 300 es\nin vec2 position;\nvoid main(){gl_Position=vec4(position,0.0,1.0);}`;
    const FRAG=`#version 300 es
precision highp float;
uniform vec2 uCenter,uHalfSize;
uniform float uRadius,uAngle,uPx,uIntensity,uShineSize,uShineFade,uThickness,uBaseWidth;
uniform vec3 uLineColor,uBaseColor;
out vec4 fragColor;
float sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
float gL(float d,float s){float x=d/(s+1e-6);float k=mix(1.0,1.6,smoothstep(0.0,1.5,x));return exp(-k*x*x);}
void main(){
  vec2 p=gl_FragCoord.xy-uCenter;
  float d=sdRR(p,uHalfSize,uRadius);
  vec2 L=vec2(cos(uAngle),sin(uAngle));
  float base=(1.0-smoothstep(0.0,uBaseWidth,abs(d)))*0.45;
  vec2 n=normalize(p/(uHalfSize*uHalfSize)+1e-6);
  float phi=acos(clamp(abs(dot(n,L)),0.0,1.0));
  float rim=1.0-smoothstep(uShineSize-uShineFade,uShineSize+uShineFade+1e-4,phi);
  float line=gL(d,uThickness);
  float ec=1.0-smoothstep(0.5*uPx,3.0*uPx,abs(d));
  float hi=line*rim*ec*uIntensity;
  vec3 col=uBaseColor*base+uLineColor*hi;
  fragColor=vec4(col,clamp(base+hi,0.0,1.0));
}`;

    const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
    const prog=gl.createProgram();
    gl.attachShader(prog,mk(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(prog); gl.useProgram(prog);
    const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
    const pl=gl.getAttribLocation(prog,'position'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
    const U=Object.fromEntries(['uCenter','uHalfSize','uRadius','uAngle','uPx','uLineColor','uBaseColor','uIntensity','uShineSize','uShineFade','uThickness','uBaseWidth'].map(n=>[n,gl.getUniformLocation(prog,n)]));
    const h2r=h=>{const c=h.replace('#','');return[parseInt(c.slice(0,2),16)/255,parseInt(c.slice(2,4),16)/255,parseInt(c.slice(4,6),16)/255];};

    let W=1,H=1;
    const resize=()=>{const r=btn.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round((W+PAD*2)*DPR);canvas.height=Math.round((H+PAD*2)*DPR);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2fv(U.uCenter,[(PAD+W/2)*DPR,(PAD+H/2)*DPR]);gl.uniform2fv(U.uHalfSize,[(W/2)*DPR,(H/2)*DPR]);};
    new ResizeObserver(resize).observe(btn); resize();

    let pAngle=null,proxT=0;
    window.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();const cx=r.left+W/2,cy=r.top+H/2;const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);const dist=Math.hypot(dx,dy);pAngle=dist===0?Math.atan2(2/H,-2/W)+((e.clientX-cx)/(W/2))*0.3+((cy-e.clientY)/(H/2))*0.15:Math.atan2(cy-e.clientY,e.clientX-cx);proxT=Math.pow(Math.max(0,1-dist/PROXIMITY),2)*(3-2*Math.max(0,1-dist/PROXIMITY));});

    const lRGB=h2r(LINE_COL),bRGB=h2r(BASE_COL);
    let angle=2.4,idle=2.4,bright=0,last=performance.now();
    (function frame(now){
      const dt=Math.min((now-last)/1000,0.05); last=now;
      idle+=SPEED*dt;
      const diff=(((pAngle!==null?pAngle:idle)-angle+Math.PI*3)%(Math.PI*2))-Math.PI;
      angle+=diff*(1-Math.exp(-dt*7));
      bright+=(proxT-bright)*(1-Math.exp(-dt*8));
      const r=Math.min(RADIUS,Math.min(W,H)/2);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(U.uAngle,angle); gl.uniform1f(U.uRadius,r*DPR); gl.uniform1f(U.uPx,DPR);
      gl.uniform3fv(U.uLineColor,lRGB); gl.uniform3fv(U.uBaseColor,bRGB);
      gl.uniform1f(U.uIntensity,INTENSITY*bright); gl.uniform1f(U.uShineSize,(SHINE_SZ*Math.PI)/180);
      gl.uniform1f(U.uShineFade,(SHINE_FD*Math.PI)/180); gl.uniform1f(U.uThickness,THICKNESS*DPR); gl.uniform1f(U.uBaseWidth,DPR);
      gl.drawArrays(gl.TRIANGLES,0,3);
      requestAnimationFrame(frame);
    })(performance.now());
  })();

  // ── SpecularButton — Back ──
  (function () {
    const btn = document.querySelector('.back-btn');
    if (!btn) return;
    const PAD=20,DPR=Math.min(window.devicePixelRatio||1,2);
    const RADIUS=100,LINE_COL='#6b6560',BASE_COL='#b5b0aa',INTENSITY=1,SHINE_SZ=10,SHINE_FD=40,THICKNESS=1,SPEED=0.35,PROXIMITY=250;
    const fx=document.createElement('span'); fx.className='sb-fx'; btn.insertBefore(fx,btn.firstChild);
    const cv=document.createElement('canvas'); Object.assign(cv.style,{display:'block',width:'100%',height:'100%'}); fx.appendChild(cv);
    const gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true}); if(!gl) return;
    gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    const V=`#version 300 es\nin vec2 p;\nvoid main(){gl_Position=vec4(p,0,1);}`;
    const F=`#version 300 es\nprecision highp float;\nuniform vec2 uC,uH;uniform float uR,uA,uPx,uI,uSS,uSF,uT,uBW;uniform vec3 uLC,uBC;out vec4 o;\nfloat sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}\nfloat gL(float d,float s){float x=d/(s+1e-6);float k=mix(1.,1.6,smoothstep(0.,1.5,x));return exp(-k*x*x);}\nvoid main(){vec2 p=gl_FragCoord.xy-uC;float d=sdRR(p,uH,uR);vec2 L=vec2(cos(uA),sin(uA));float base=(1.-smoothstep(0.,uBW,abs(d)))*.45;vec2 n=normalize(p/(uH*uH)+1e-6);float phi=acos(clamp(abs(dot(n,L)),0.,1.));float rim=1.-smoothstep(uSS-uSF,uSS+uSF+1e-4,phi);float line=gL(d,uT);float ec=1.-smoothstep(.5*uPx,3.*uPx,abs(d));float hi=line*rim*ec*uI;vec3 col=uBC*base+uLC*hi;o=vec4(col,clamp(base+hi,0.,1.));}`;
    const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
    const pr=gl.createProgram(); gl.attachShader(pr,mk(gl.VERTEX_SHADER,V)); gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,F)); gl.linkProgram(pr); gl.useProgram(pr);
    const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const va=gl.createVertexArray(); gl.bindVertexArray(va); const al=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
    const U=Object.fromEntries(['uC','uH','uR','uA','uPx','uI','uSS','uSF','uT','uBW','uLC','uBC'].map(n=>[n,gl.getUniformLocation(pr,n)]));
    const h2r=h=>{const c=h.replace('#','');return[parseInt(c.slice(0,2),16)/255,parseInt(c.slice(2,4),16)/255,parseInt(c.slice(4,6),16)/255];};
    let W=1,H=1;
    const rsz=()=>{const r=btn.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round((W+PAD*2)*DPR);cv.height=Math.round((H+PAD*2)*DPR);gl.viewport(0,0,cv.width,cv.height);gl.uniform2fv(U.uC,[(PAD+W/2)*DPR,(PAD+H/2)*DPR]);gl.uniform2fv(U.uH,[(W/2)*DPR,(H/2)*DPR]);};
    new ResizeObserver(rsz).observe(btn); rsz();
    let pA=null,pT=0; window.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();const cx=r.left+W/2,cy=r.top+H/2;const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);const dist=Math.hypot(dx,dy);pA=dist===0?Math.atan2(2/H,-2/W)+((e.clientX-cx)/(W/2))*.3+((cy-e.clientY)/(H/2))*.15:Math.atan2(cy-e.clientY,e.clientX-cx);pT=Math.pow(Math.max(0,1-dist/PROXIMITY),2)*(3-2*Math.max(0,1-dist/PROXIMITY));},{passive:true});
    const lR=h2r(LINE_COL),bR=h2r(BASE_COL); let ang=2.4,idle=2.4,br=0,last=performance.now();
    (function fr(now){const dt=Math.min((now-last)/1000,.05);last=now;idle+=SPEED*dt;const df=(((pA!==null?pA:idle)-ang+Math.PI*3)%(Math.PI*2))-Math.PI;ang+=df*(1-Math.exp(-dt*7));br+=(pT-br)*(1-Math.exp(-dt*8));const r=Math.min(RADIUS,Math.min(W,H)/2);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(U.uA,ang);gl.uniform1f(U.uR,r*DPR);gl.uniform1f(U.uPx,DPR);gl.uniform3fv(U.uLC,lR);gl.uniform3fv(U.uBC,bR);gl.uniform1f(U.uI,INTENSITY*br);gl.uniform1f(U.uSS,(SHINE_SZ*Math.PI)/180);gl.uniform1f(U.uSF,(SHINE_FD*Math.PI)/180);gl.uniform1f(U.uT,THICKNESS*DPR);gl.uniform1f(U.uBW,DPR);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(fr);})(performance.now());
  })();
  </script>

<script src="/static/pilnav.js"></script>
</body>
</html>
