<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoLoop — Preferences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <link rel="stylesheet" href="/static/pilnav.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #f2f0ed;
      --border:    #dddbd7;
      --text:      #1e1c1a;
      --muted:     #6b6560;
      --faint:     #9c9690;
      --pill-bg:   #e8e5e0;
      --pill-text: #4a4540;
      --sel-bg:    #2c2a27;
      --sel-text:  #f5f3ef;
      --font:      'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body { height: 100%; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100%; padding-top:56px; padding-bottom:env(safe-area-inset-bottom); }


    .main { display:flex; flex-direction:column; padding:20px 24px 16px; }

    .page-title { font-size:clamp(26px,7vw,34px); font-weight:800; letter-spacing:-0.03em; line-height:1.15; margin-bottom:4px; }
    .page-sub   { font-size:clamp(12px,3.2vw,14px); color:var(--muted); line-height:1.6; margin-bottom:18px; }

    .section-label { font-size:10px; font-weight:700; color:var(--faint); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px; }

    .pill-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }

    .pill {
      padding:9px 18px; border-radius:100px;
      background:var(--pill-bg); color:var(--pill-text);
      font-family:var(--font); font-size:13px; font-weight:500;
      border:none; cursor:pointer;
      transition:background 0.15s, color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color:transparent;
    }
    .pill:hover    { background:#d8d4cf; }
    .pill.selected { background:var(--sel-bg); color:var(--sel-text); }
    .pill:active   { transform:scale(0.96); }
    .pill.disabled { opacity:0.38; cursor:not-allowed; pointer-events:none; }
    .pill .coming-soon { font-size:10px; font-weight:400; opacity:0.7; margin-left:4px; }

    .btn-row { margin-top:32px; padding-bottom:32px; display:flex; justify-content:center; align-items:center; gap:16px; }

    .back-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; overflow:visible; isolation:isolate; background:transparent; color:var(--text); font-family:var(--font); font-weight:700; font-size:1rem; letter-spacing:0.01em; line-height:1; padding:11px 20px; border-radius:100px; border:1.5px solid var(--border); cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; transition:transform 0.15s; }
    .back-btn:active { transform:scale(0.97); }

    #next-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; overflow:visible; isolation:isolate; background:transparent; color:var(--text); font-family:var(--font); font-weight:700; font-size:1rem; letter-spacing:0.01em; line-height:1; padding:11px 28px; min-width:124px; border-radius:100px; border:none; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; transition:transform 0.15s; }
    #next-btn:active { transform:scale(0.97); }
    #next-btn .sb-fx { position:absolute; inset:-20px; pointer-events:none; z-index:1; }
    #next-btn .sb-fx canvas { display:block; width:100%; height:100%; }
    #next-btn .sb-label { position:relative; z-index:2; display:inline-flex; align-items:center; gap:8px; }
    .sb-arrow { font-size:15px; display:inline-block; transition:transform 0.2s; }
    #next-btn:hover .sb-arrow { transform:translateX(4px); }
  </style>
</head>
<body>

<header class="gl-nav-header">
  <nav class="gl-pill-nav" aria-label="Primary">
    <a class="gl-pill-logo" href="/" aria-label="Home">
      <svg width="20" height="18" viewBox="0 0 22 20" fill="none" aria-hidden="true">
        <rect x="0"  y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="13" y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="0"  y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="13" y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="0"  y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="0"  y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="13" y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="10" y="0"  width="2"  height="20" rx="0.5" fill="rgba(255,255,255,1)"/>
      </svg>
    </a>
    <div class="gl-pill-nav-items">
      <ul class="gl-pill-list" role="menubar">
        <li role="none"><a role="menuitem" href="/welcome.html" class="gl-pill-btn"><span class="gl-hover-circle" aria-hidden="true"></span><span class="gl-label-stack"><span class="gl-pill-label">GeoLoop</span><span class="gl-pill-label-hover" aria-hidden="true">GeoLoop</span></span></a></li>
        <li role="none"><a role="menuitem" href="/account.html" class="gl-pill-btn"><span class="gl-hover-circle" aria-hidden="true"></span><span class="gl-label-stack"><span class="gl-pill-label">Home</span><span class="gl-pill-label-hover" aria-hidden="true">Home</span></span></a></li>
        <li role="none"><a role="menuitem" href="/contact.html" class="gl-pill-btn"><span class="gl-hover-circle" aria-hidden="true"></span><span class="gl-label-stack"><span class="gl-pill-label">Contact</span><span class="gl-pill-label-hover" aria-hidden="true">Contact</span></span></a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="main">
  <h1 class="page-title">Your preferences</h1>
  <p class="page-sub">Helps us format your results.</p>

  <div class="section-label">Region</div>
  <div class="pill-row" id="regionGrid">
    <button class="pill selected" data-region="US">United States</button>
    <button class="pill disabled" data-region="CA">Canada<span class="coming-soon">· soon</span></button>
    <button class="pill disabled" data-region="EU">Europe<span class="coming-soon">· soon</span></button>
    <button class="pill disabled" data-region="CN">China<span class="coming-soon">· soon</span></button>
    <button class="pill disabled" data-region="AU">Australia<span class="coming-soon">· soon</span></button>
    <button class="pill disabled" data-region="UK">United Kingdom<span class="coming-soon">· soon</span></button>
  </div>

  <div class="section-label">Units</div>
  <div class="pill-row" id="unitsGrid">
    <button class="pill selected" data-units="imperial">Imperial &nbsp;ft · °F · BTU</button>
    <button class="pill" data-units="metric">Metric &nbsp;m · °C · kWh</button>
  </div>
</main>

<div class="btn-row">
  <button class="back-btn" onclick="history.back()">‹ Back</button>
  <button id="next-btn" onclick="goNext()">
    <span class="sb-label">Next <span class="sb-arrow">›</span></span>
  </button>
</div>

<script>
// Single-select for each group
document.getElementById('regionGrid').addEventListener('click', e => {
  const p = e.target.closest('.pill:not(.disabled)'); if (!p) return;
  document.querySelectorAll('#regionGrid .pill').forEach(x => x.classList.remove('selected'));
  p.classList.add('selected');
});
document.getElementById('unitsGrid').addEventListener('click', e => {
  const p = e.target.closest('.pill'); if (!p) return;
  document.querySelectorAll('#unitsGrid .pill').forEach(x => x.classList.remove('selected'));
  p.classList.add('selected');
});

function goNext() {
  const region = document.querySelector('#regionGrid .pill.selected')?.dataset.region || 'US';
  const units  = document.querySelector('#unitsGrid .pill.selected')?.dataset.units  || 'imperial';
  sessionStorage.setItem('gl_region', region);
  sessionStorage.setItem('gl_units', units);
  window.location.href = 'onboarding_2.html';
}

// Specular button
(function () {
  const btn = document.getElementById('next-btn');
  const PAD=20,DPR=Math.min(window.devicePixelRatio||1,2);
  const RADIUS=100,LINE_COL='#6b6560',BASE_COL='#b5b0aa',INTENSITY=1,SHINE_SZ=10,SHINE_FD=40,THICKNESS=1,SPEED=0.35,PROXIMITY=250;
  const fx=document.createElement('span'); fx.className='sb-fx'; btn.insertBefore(fx,btn.firstChild);
  const cv=document.createElement('canvas'); Object.assign(cv.style,{display:'block',width:'100%',height:'100%'}); fx.appendChild(cv);
  const gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true}); if(!gl) return;
  gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  const V=`#version 300 es\nin vec2 p;\nvoid main(){gl_Position=vec4(p,0,1);}`;
  const F=`#version 300 es\nprecision highp float;\nuniform vec2 uC,uH;uniform float uR,uA,uPx,uI,uSS,uSF,uT,uBW;uniform vec3 uLC,uBC;out vec4 o;\nfloat sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}\nfloat gL(float d,float s){float x=d/(s+1e-6);float k=mix(1.,1.6,smoothstep(0.,1.5,x));return exp(-k*x*x);}\nvoid main(){vec2 p=gl_FragCoord.xy-uC;float d=sdRR(p,uH,uR);vec2 L=vec2(cos(uA),sin(uA));float base=(1.-smoothstep(0.,uBW,abs(d)))*.45;vec2 n=normalize(p/(uH*uH)+1e-6);float phi=acos(clamp(abs(dot(n,L)),0.,1.));float rim=1.-smoothstep(uSS-uSF,uSS+uSF+1e-4,phi);float line=gL(d,uT);float ec=1.-smoothstep(.5*uPx,3.*uPx,abs(d));float hi=line*rim*ec*uI;vec3 col=uBC*base+uLC*hi;o=vec4(col,clamp(base+hi,0.,1.));}`;
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
  const pr=gl.createProgram(); gl.attachShader(pr,mk(gl.VERTEX_SHADER,V)); gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,F)); gl.linkProgram(pr); gl.useProgram(pr);
  const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const va=gl.createVertexArray(); gl.bindVertexArray(va); const al=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  const U=Object.fromEntries(['uC','uH','uR','uA','uPx','uI','uSS','uSF','uT','uBW','uLC','uBC'].map(n=>[n,gl.getUniformLocation(pr,n)]));
  const h2r=h=>{const c=h.replace('#','');return[parseInt(c.slice(0,2),16)/255,parseInt(c.slice(2,4),16)/255,parseInt(c.slice(4,6),16)/255];};
  let W=1,H=1;
  const rsz=()=>{const r=btn.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round((W+PAD*2)*DPR);cv.height=Math.round((H+PAD*2)*DPR);gl.viewport(0,0,cv.width,cv.height);gl.uniform2fv(U.uC,[(PAD+W/2)*DPR,(PAD+H/2)*DPR]);gl.uniform2fv(U.uH,[(W/2)*DPR,(H/2)*DPR]);};
  new ResizeObserver(rsz).observe(btn); rsz();
  let pA=null,pT=0; window.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();const cx=r.left+W/2,cy=r.top+H/2;const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);const dist=Math.hypot(dx,dy);pA=dist===0?Math.atan2(2/H,-2/W)+((e.clientX-cx)/(W/2))*.3+((cy-e.clientY)/(H/2))*.15:Math.atan2(cy-e.clientY,e.clientX-cx);pT=Math.pow(Math.max(0,1-dist/PROXIMITY),2)*(3-2*Math.max(0,1-dist/PROXIMITY));},{passive:true});
  const lR=h2r(LINE_COL),bR=h2r(BASE_COL); let ang=2.4,idle=2.4,br=0,last=performance.now();
  (function fr(now){const dt=Math.min((now-last)/1000,.05);last=now;idle+=SPEED*dt;const df=(((pA!==null?pA:idle)-ang+Math.PI*3)%(Math.PI*2))-Math.PI;ang+=df*(1-Math.exp(-dt*7));br+=(pT-br)*(1-Math.exp(-dt*8));const r=Math.min(RADIUS,Math.min(W,H)/2);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(U.uA,ang);gl.uniform1f(U.uR,r*DPR);gl.uniform1f(U.uPx,DPR);gl.uniform3fv(U.uLC,lR);gl.uniform3fv(U.uBC,bR);gl.uniform1f(U.uI,INTENSITY*br);gl.uniform1f(U.uSS,(SHINE_SZ*Math.PI)/180);gl.uniform1f(U.uSF,(SHINE_FD*Math.PI)/180);gl.uniform1f(U.uT,THICKNESS*DPR);gl.uniform1f(U.uBW,DPR);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(fr);})(performance.now());
})();
</script>
<script src="/static/pilnav.js"></script>
</body>
</html>
