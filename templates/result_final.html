<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoLoop — Borefield Sizing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <link rel="stylesheet" href="/static/pilnav.css">
  <style><style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #f5f3f0;
      --border: #dddbd7;
      --text:   #1a1814;
      --muted:  #7a7570;
      --faint:  #a09c97;
      --font:   'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100%; padding-bottom: env(safe-area-inset-bottom); }


    .main { flex:1; display:flex; flex-direction:column; padding:28px 24px 40px; }

    .top-header { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
    .stage-badge { width:48px; height:48px; border-radius:50%; background:var(--text); color:#f5f3f0; font-size:13px; font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

    .section-title { font-size:clamp(20px,5.5vw,26px); font-weight:700; letter-spacing:-0.025em; margin-bottom:6px; }
    .section-sub   { font-size:12px; color:var(--faint); margin-bottom:28px; line-height:1.5; }

    .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:200px; gap:16px; color:var(--muted); font-size:13px; }
    .spinner { width:32px; height:32px; border:2.5px solid var(--border); border-top-color:var(--text); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .result-card { background:white; border:1.5px solid var(--border); border-radius:16px; padding:18px; margin-bottom:12px; }
    .card-label { font-size:10px; font-weight:600; color:var(--faint); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px; }
    .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .stat-grid.three { grid-template-columns:1fr 1fr 1fr; }
    .stat { display:flex; flex-direction:column; gap:4px; }
    .stat-val { font-size:22px; font-weight:700; color:var(--text); letter-spacing:-0.02em; line-height:1; }
    .stat-unit { font-size:12px; font-weight:400; color:var(--faint); margin-left:3px; }
    .stat-lbl { font-size:11px; color:var(--muted); line-height:1.4; }
    .divider { height:1px; background:var(--border); margin:14px 0; }

    .canvas-wrap { background:white; border:1.5px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:12px; }
    .canvas-label { font-size:10px; font-weight:600; color:var(--faint); letter-spacing:0.1em; text-transform:uppercase; padding:12px 18px 4px; }
    .canvas-meta { font-size:11px; color:var(--muted); padding:0 18px 10px; line-height:1.5; }
    #borefield-canvas { display:block; width:100%; height:220px; }

    .btn-bottom { margin-top:auto; padding-top:28px; display:flex; justify-content:center; align-items:center; gap:16px; }
    .back-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; overflow:visible; isolation:isolate; background:transparent; color:var(--text); font-family:var(--font); font-weight:700; font-size:0.95rem; letter-spacing:0.01em; line-height:1; padding:11px 20px; border-radius:100px; border:none; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; transition:transform 0.15s ease; }
    .back-btn:active { transform:scale(0.97); }
    .back-btn .sb-fx { position:absolute; inset:-20px; pointer-events:none; z-index:1; }
    .back-btn .sb-fx canvas { display:block; width:100%; height:100%; }
    .back-btn .sb-label { position:relative; z-index:2; white-space:nowrap; }
    #next-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; overflow:visible; isolation:isolate; background:transparent; color:var(--text); font-family:var(--font); font-weight:700; font-size:0.95rem; letter-spacing:0.01em; line-height:1; padding:11px 28px; min-width:160px; border-radius:100px; border:none; cursor:pointer; outline:none; -webkit-tap-highlight-color:transparent; transition:transform 0.15s ease; }
    #next-btn:active { transform:scale(0.97); }
    #next-btn .sb-fx { position:absolute; inset:-20px; pointer-events:none; z-index:1; }
    #next-btn .sb-fx canvas { display:block; width:100%; height:100%; }
    #next-btn .sb-label { position:relative; z-index:2; white-space:nowrap; }

    .error-msg { text-align:center; padding:24px; color:#e05c4a; font-size:13px; line-height:1.6; }

  </style></style>
</head>
<body>

<header class="gl-nav-header">
  <ul class="gl-pill-list" id="gl-pill-nav">
    <li class="gl-pill gl-pill-logo" aria-label="GeoLoop">
      <svg width="20" height="18" viewBox="0 0 22 20" fill="none" aria-hidden="true">
        <rect x="0"  y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="13" y="0"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,1)"/>
        <rect x="0"  y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="13" y="5"  width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.75)"/>
        <rect x="0"  y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="13" y="10" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.5)"/>
        <rect x="0"  y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="13" y="15" width="9"  height="3" rx="0.5" fill="rgba(255,255,255,.3)"/>
        <rect x="10" y="0"  width="2"  height="20" rx="0.5" fill="rgba(255,255,255,1)"/>
      </svg>
    </li>
    <li class="gl-pill gl-pill-text" data-href="units.html" data-label="GeoLoop">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">GeoLoop</span><span class="gl-pill-label-hover">GeoLoop</span></div>
    </li>
    <li class="gl-pill gl-pill-text" data-href="account.html" data-label="Home">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">Home</span><span class="gl-pill-label-hover">Home</span></div>
    </li>
    <li class="gl-pill gl-pill-text" data-href="contact.html" data-label="Contact">
      <div class="gl-hover-circle"></div>
      <div class="gl-label-stack"><span class="gl-pill-label">Contact</span><span class="gl-pill-label-hover">Contact</span></div>
    </li>
  </ul>
</header>

<main class="main">

  <div class="top-header">
    <div class="stage-badge">3/3</div>
  </div>

  <div class="section-title">Borefield Results</div>
  <div class="section-sub">Philippe et al. (2010) three-pulse sizing method</div>

  <div class="loading" id="loading-state">
    <div class="spinner"></div>
    <span>Running borefield sizing…</span>
  </div>

  <div id="error-state" style="display:none" class="error-msg"></div>

  <div id="results-state" style="display:none">

    <div class="result-card">
      <div class="card-label">Borefield Geometry</div>
      <div class="stat-grid three">
        <div class="stat">
          <div class="stat-val" id="r-nb">—</div>
          <div class="stat-lbl">Boreholes</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="r-depth">—<span class="stat-unit" data-unit="length">m</span></div>
          <div class="stat-lbl">Depth each</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="r-ltot">—<span class="stat-unit" data-unit="length">m</span></div>
          <div class="stat-lbl">Total length</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="stat-grid">
        <div class="stat">
          <div class="stat-val" id="r-area">—<span class="stat-unit" data-unit="area">m²</span></div>
          <div class="stat-lbl">Land footprint</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="r-spacing">—<span class="stat-unit" data-unit="length">m</span></div>
          <div class="stat-lbl">Spacing</div>
        </div>
      </div>
    </div>

    <div class="canvas-wrap">
      <div class="canvas-label">Site Plan</div>
      <div class="canvas-meta" id="bf-canvas-meta"></div>
      <canvas id="borefield-canvas"></canvas>
    </div>

  </div><!-- /results-state -->

  <div class="btn-bottom" id="btn-row" style="display:none">
    <button class="back-btn" id="back-btn" onclick="history.back()"><span class="sb-label">‹ Back</span></button>
    <button id="next-btn" onclick="window.location.href='result_strategy.html'">
      <span class="sb-fx"><canvas></canvas></span>
      <span class="sb-label">Hybrid Strategy & Cost</span>
    </button>
  </div>

</main>

<script src="static/borehole_plan.js"></script>
<script src="/static/unit_convert.js"></script>
<script>
const FLASK = '';

(async function () {
  const r1 = JSON.parse(sessionStorage.getItem('gl_result1') || '{}');
  const payload = {
    site:             r1.site   || null,
    loads:            r1.loads  || null,
    building_type:    r1.building_type || sessionStorage.getItem('gl_building_type') || '',
    floor_area_m2:    r1.floor_area_m2 || sessionStorage.getItem('gl_area') || null,
    footprint_shape:  r1.footprint_shape || sessionStorage.getItem('gl_footprint_shape') || 'rect_2_1',
    num_floors:       r1.num_floors || sessionStorage.getItem('gl_floors') || null,
    borehole_depth:   sessionStorage.getItem('gl_borehole_depth')   || '150',
    borehole_spacing: sessionStorage.getItem('gl_borehole_spacing') || '6',
    grout_k:          sessionStorage.getItem('gl_s_kgrout')          || '',
  };

  try {
    const res = await fetch(FLASK + '/size', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    const sizeData = await res.json();
    sessionStorage.setItem('gl_result_final', JSON.stringify(sizeData));

    // populate
    const f = (v, dec=0) => v != null ? GeoUnits.format(v, 'length', dec) : '—';
    setText('r-nb',      sizeData.NB || sizeData.n_boreholes || '—');
    setText('r-depth',   f(sizeData.H  || sizeData.borehole_depth));
    setText('r-ltot',    f(sizeData.L  || sizeData.total_length));
    setText('r-area',    sizeData.land_area != null ? GeoUnits.format(sizeData.land_area, 'area', 0) : '—');
    setText('r-spacing', f(sizeData.borehole_spacing, 1));
    document.querySelectorAll('.stat-unit[data-unit]').forEach(el => el.textContent = GeoUnits.label(el.dataset.unit));

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('results-state').style.display = '';
    document.getElementById('btn-row').style.display = '';

    setTimeout(() => {
      const cv = document.getElementById('borefield-canvas');
      if (cv && typeof drawBoreholePlan === 'function') {
        const meta = drawBoreholePlan(cv, sizeData);
        if (meta) {
          const parts = [meta.shape_label, meta.footprint_m2 ? `${Math.round(meta.footprint_m2).toLocaleString()} m²` : null, meta.n_floors ? `${meta.n_floors} floor(s)` : null].filter(Boolean);
          document.getElementById('bf-canvas-meta').textContent = parts.join(' · ');
        }
      }
    }, 50);

    initSBtn('next-btn');
    initSBtn('back-btn');

  } catch (err) {
    document.getElementById('loading-state').style.display = 'none';
    const el = document.getElementById('error-state');
    el.style.display = '';
    el.textContent = 'Could not complete sizing: ' + err.message;
  }
})();

function setText(id, v) {
  const el = document.getElementById(id); if (!el) return;
  const unit = el.querySelector('.stat-unit');
  if (unit) el.childNodes[0].nodeValue = String(v);
  else el.textContent = String(v);
}

function initSBtn(id) {
  const btn = document.getElementById(id); if (!btn) return;
  const PAD=20,DPR=Math.min(window.devicePixelRatio||1,2);
  const RADIUS=100,LINE_COL='#7a6a5a',BASE_COL='#c4a882',INTENSITY=1,SHINE_SZ=10,SHINE_FD=40,THICKNESS=1,SPEED=0.35,PROXIMITY=220;
  const fx=document.createElement('span'); fx.className='sb-fx'; btn.insertBefore(fx,btn.firstChild);
  const cv=document.createElement('canvas'); Object.assign(cv.style,{display:'block',width:'100%',height:'100%'}); fx.appendChild(cv);
  const gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true}); if(!gl) return;
  gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  const V=`#version 300 es\nin vec2 p;\nvoid main(){gl_Position=vec4(p,0,1);}`;
  const F=`#version 300 es\nprecision highp float;\nuniform vec2 uC,uH;uniform float uR,uA,uPx,uI,uSS,uSF,uT,uBW;uniform vec3 uLC,uBC;out vec4 o;\nfloat sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}\nfloat gL(float d,float s){float x=d/(s+1e-6);float k=mix(1.,1.6,smoothstep(0.,1.5,x));return exp(-k*x*x);}\nvoid main(){vec2 p=gl_FragCoord.xy-uC;float d=sdRR(p,uH,uR);vec2 L=vec2(cos(uA),sin(uA));float base=(1.-smoothstep(0.,uBW,abs(d)))*.45;vec2 n=normalize(p/(uH*uH)+1e-6);float phi=acos(clamp(abs(dot(n,L)),0.,1.));float rim=1.-smoothstep(uSS-uSF,uSS+uSF+1e-4,phi);float line=gL(d,uT);float ec=1.-smoothstep(.5*uPx,3.*uPx,abs(d));float hi=line*rim*ec*uI;vec3 col=uBC*base+uLC*hi;o=vec4(col,clamp(base+hi,0.,1.));}`;
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
  const pr=gl.createProgram(); gl.attachShader(pr,mk(gl.VERTEX_SHADER,V)); gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,F)); gl.linkProgram(pr); gl.useProgram(pr);
  const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const va=gl.createVertexArray(); gl.bindVertexArray(va); const al=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  const U=Object.fromEntries(['uC','uH','uR','uA','uPx','uI','uSS','uSF','uT','uBW','uLC','uBC'].map(n=>[n,gl.getUniformLocation(pr,n)]));
  const h2r=h=>{const c=h.replace('#','');return[parseInt(c.slice(0,2),16)/255,parseInt(c.slice(2,4),16)/255,parseInt(c.slice(4,6),16)/255];};
  let W=1,H=1;
  const rsz=()=>{const r=btn.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round((W+PAD*2)*DPR);cv.height=Math.round((H+PAD*2)*DPR);gl.viewport(0,0,cv.width,cv.height);gl.uniform2fv(U.uC,[(PAD+W/2)*DPR,(PAD+H/2)*DPR]);gl.uniform2fv(U.uH,[(W/2)*DPR,(H/2)*DPR]);};
  new ResizeObserver(rsz).observe(btn); rsz();
  let pA=null,pT=0; window.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();const cx=r.left+W/2,cy=r.top+H/2;const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);const dist=Math.hypot(dx,dy);pA=dist===0?Math.atan2(2/H,-2/W)+((e.clientX-cx)/(W/2))*.3+((cy-e.clientY)/(H/2))*.15:Math.atan2(cy-e.clientY,e.clientX-cx);pT=Math.pow(Math.max(0,1-dist/PROXIMITY),2)*(3-2*Math.max(0,1-dist/PROXIMITY));},{passive:true});
  const lR=h2r(LINE_COL),bR=h2r(BASE_COL); let ang=2.4,idle=2.4,br=0,last=performance.now();
  (function fr(now){const dt=Math.min((now-last)/1000,.05);last=now;idle+=SPEED*dt;const df=(((pA!==null?pA:idle)-ang+Math.PI*3)%(Math.PI*2))-Math.PI;ang+=df*(1-Math.exp(-dt*7));br+=(pT-br)*(1-Math.exp(-dt*8));const r=Math.min(RADIUS,Math.min(W,H)/2);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(U.uA,ang);gl.uniform1f(U.uR,r*DPR);gl.uniform1f(U.uPx,DPR);gl.uniform3fv(U.uLC,lR);gl.uniform3fv(U.uBC,bR);gl.uniform1f(U.uI,INTENSITY*br);gl.uniform1f(U.uSS,(SHINE_SZ*Math.PI)/180);gl.uniform1f(U.uSF,(SHINE_FD*Math.PI)/180);gl.uniform1f(U.uT,THICKNESS*DPR);gl.uniform1f(U.uBW,DPR);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(fr);})(performance.now());
}
</script>
<script src="/static/pilnav.js"></script>
</body>
</html>
