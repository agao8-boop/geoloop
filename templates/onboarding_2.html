<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoLoop — Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/design-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f5f3f0;
      --border:  #dddbd7;
      --text:    #1a1814;
      --muted:   #7a7570;
      --faint:   #a09c97;
      --card-bg: #eeecea;
      --font:    'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Nav ── */
    .nav {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(245,243,240,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }
    .nav-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); }
    .nav-name  { font-size:15px; font-weight:700; letter-spacing:-0.02em; }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 28px 24px 36px;
    }

    /* ── Top row: badge + next button ── */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    /* 0/3 badge — 1.5× the stage icon size */
    .stage-badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--text);
      color: #f5f3f0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Next button (small SpecularButton shell) ── */
    #skip-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      isolation: isolate;
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.01em;
      line-height: 1;
      padding: 7px 18px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }
    #skip-btn:active { transform: scale(0.96); }
    #skip-btn .sb-fx { position:absolute; inset:-16px; pointer-events:none; z-index:1; }
    #skip-btn .sb-fx canvas { display:block; width:100%; height:100%; }
    #skip-btn .sb-label { position:relative; z-index:2; }

    /* ── Heading ── */
    .heading {
      margin-bottom: auto;
      padding-bottom: 32px;
    }

    .heading h1 {
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.75;
      color: var(--text);
      margin-bottom: 12px;
    }

    .heading p {
      font-size: clamp(12px, 3.2vw, 14px);
      color: var(--muted);
      font-weight: 400;
      line-height: 1.6;
    }

    /* ── Stage list ── */
    .stage-list {
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-bg);
    }

    .stage-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 18px;
      cursor: pointer;
      transition: background 0.12s ease;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid var(--border);
    }
    .stage-item:last-child { border-bottom: none; }
    .stage-item:hover { background: #e5e2de; }

    .stage-item.locked {
      pointer-events: none;
      cursor: default;
    }
    .stage-item.locked:hover { background: transparent; }

    /* stage icon — 54px, matches badge */
    .stage-icon {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
    }

    .stage-info { flex: 1; min-width: 0; }

    .stage-num {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
      line-height: 1.5;
      margin-bottom: 1px;
    }

    .stage-title {
      display: block;
      font-size: clamp(14px, 3.8vw, 15px);
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 3px;
    }

    /* gray subtitle — one line, truncate if overflows */
    .stage-sub {
      display: block;
      font-size: clamp(11px, 2.8vw, 12px);
      font-weight: 400;
      color: var(--faint);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-item.locked .stage-num,
    .stage-item.locked .stage-title,
    .stage-item.locked .stage-sub { color: var(--faint); }

    .stage-arrow {
      font-size: 18px;
      color: var(--text);
      flex-shrink: 0;
      font-weight: 400;
      align-self: center;
    }
    .stage-item.locked .stage-arrow { color: var(--faint); }

    @media (min-width: 640px) {
      .nav  { padding: 0 32px; height: 56px; }
      .main { padding: 36px 40px 48px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="nav-brand" href="welcome.html">
      <svg width="22" height="20" viewBox="0 0 22 20" fill="none" aria-hidden="true">
        <rect x="0"  y="0"  width="9"  height="3"  rx="0.5" fill="#1a1814"/>
        <rect x="13" y="0"  width="9"  height="3"  rx="0.5" fill="#1a1814"/>
        <rect x="0"  y="5"  width="9"  height="3"  rx="0.5" fill="#374151"/>
        <rect x="13" y="5"  width="9"  height="3"  rx="0.5" fill="#374151"/>
        <rect x="0"  y="10" width="9"  height="3"  rx="0.5" fill="#6b7280"/>
        <rect x="13" y="10" width="9"  height="3"  rx="0.5" fill="#6b7280"/>
        <rect x="0"  y="15" width="9"  height="3"  rx="0.5" fill="#9ca3af"/>
        <rect x="13" y="15" width="9"  height="3"  rx="0.5" fill="#9ca3af"/>
        <rect x="10" y="0"  width="2"  height="20" rx="0.5" fill="#1a1814"/>
      </svg>
      <span class="nav-name">GeoLoop</span>
    </a>
  </nav>

  <main class="main">

    <!-- Badge + Next -->
    <div class="top-row">
      <div class="stage-badge" aria-label="Step 0 of 3">0/3</div>
      <button id="skip-btn" onclick="window.location.href='stage1a.html'" aria-label="Next to step 1">
        <span class="sb-label">Next ›</span>
      </button>
    </div>

    <!-- Heading -->
    <div class="heading">
      <h1>Ready to size your geothermal system<br>in 30 seconds?</h1>
      <p>Quick inputs. No expertise needed. No personal info.</p>
    </div>

    <!-- Stage list -->
    <div class="stage-list" role="list">

      <!-- 01 Site & Building — active -->
      <a class="stage-item" href="stage1a.html" role="listitem" aria-label="Go to step 1: Site and Building">
        <div class="stage-icon">
          <svg width="54" height="54" viewBox="0 0 54 54">
            <defs>
              <radialGradient id="sg1" cx="36%" cy="32%" r="68%">
                <stop offset="0%" stop-color="#d8d4ce"/>
                <stop offset="55%" stop-color="#b0aba4"/>
                <stop offset="100%" stop-color="#888480"/>
              </radialGradient>
            </defs>
            <circle cx="27" cy="27" r="27" fill="url(#sg1)"/>
          </svg>
        </div>
        <div class="stage-info">
          <span class="stage-num">01</span>
          <span class="stage-title">Site &amp; Building</span>
          <span class="stage-sub">ZIP, building type, floor area</span>
        </div>
        <span class="stage-arrow">→</span>
      </a>

      <!-- 02 Borefield — locked -->
      <div class="stage-item locked" role="listitem" aria-disabled="true">
        <div class="stage-icon">
          <svg width="54" height="54" viewBox="0 0 54 54">
            <defs>
              <radialGradient id="sg2" cx="36%" cy="32%" r="68%">
                <stop offset="0%" stop-color="#e0ddd9"/>
                <stop offset="55%" stop-color="#c8c4be"/>
                <stop offset="100%" stop-color="#a8a49f"/>
              </radialGradient>
            </defs>
            <circle cx="27" cy="27" r="27" fill="url(#sg2)"/>
          </svg>
        </div>
        <div class="stage-info">
          <span class="stage-num">02</span>
          <span class="stage-title">Borefield</span>
          <span class="stage-sub">Depth, count, loop configuration</span>
        </div>
        <span class="stage-arrow">→</span>
      </div>

      <!-- 03 Results — locked -->
      <div class="stage-item locked" role="listitem" aria-disabled="true">
        <div class="stage-icon">
          <svg width="54" height="54" viewBox="0 0 54 54">
            <defs>
              <radialGradient id="sg3" cx="36%" cy="32%" r="68%">
                <stop offset="0%" stop-color="#e0ddd9"/>
                <stop offset="55%" stop-color="#c8c4be"/>
                <stop offset="100%" stop-color="#a8a49f"/>
              </radialGradient>
            </defs>
            <circle cx="27" cy="27" r="27" fill="url(#sg3)"/>
          </svg>
        </div>
        <div class="stage-info">
          <span class="stage-num">03</span>
          <span class="stage-title">Results</span>
          <span class="stage-sub">Suitability score and cost range</span>
        </div>
        <span class="stage-arrow">→</span>
      </div>

    </div>

  </main>

  <script>
  // ── SpecularButton for Next (small variant) ──
  (function () {
    const btn = document.getElementById('skip-btn');
    const PAD=16, DPR=Math.min(window.devicePixelRatio||1, 2);
    const RADIUS=100, LINE_COL='#9c9690', BASE_COL='#c8c4be';
    const INTENSITY=1, SHINE_SZ=10, SHINE_FD=40, THICKNESS=1, SPEED=0.35, PROXIMITY=180;

    const fx=document.createElement('span'); fx.className='sb-fx'; btn.insertBefore(fx,btn.firstChild);
    const canvas=document.createElement('canvas'); Object.assign(canvas.style,{display:'block',width:'100%',height:'100%'}); fx.appendChild(canvas);
    const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true});
    if(!gl) return;
    gl.clearColor(0,0,0,0); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);

    const VERT=`#version 300 es\nin vec2 position;\nvoid main(){gl_Position=vec4(position,0.0,1.0);}`;
    const FRAG=`#version 300 es
precision highp float;
uniform vec2 uCenter,uHalfSize;
uniform float uRadius,uAngle,uPx,uIntensity,uShineSize,uShineFade,uThickness,uBaseWidth;
uniform vec3 uLineColor,uBaseColor;
out vec4 fragColor;
float sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
float gL(float d,float s){float x=d/(s+1e-6);float k=mix(1.0,1.6,smoothstep(0.0,1.5,x));return exp(-k*x*x);}
void main(){
  vec2 p=gl_FragCoord.xy-uCenter;
  float d=sdRR(p,uHalfSize,uRadius);
  vec2 L=vec2(cos(uAngle),sin(uAngle));
  float base=(1.0-smoothstep(0.0,uBaseWidth,abs(d)))*0.45;
  vec2 n=normalize(p/(uHalfSize*uHalfSize)+1e-6);
  float phi=acos(clamp(abs(dot(n,L)),0.0,1.0));
  float rim=1.0-smoothstep(uShineSize-uShineFade,uShineSize+uShineFade+1e-4,phi);
  float line=gL(d,uThickness);
  float ec=1.0-smoothstep(0.5*uPx,3.0*uPx,abs(d));
  float hi=line*rim*ec*uIntensity;
  vec3 col=uBaseColor*base+uLineColor*hi;
  fragColor=vec4(col,clamp(base+hi,0.0,1.0));
}`;

    const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;};
    const prog=gl.createProgram();
    gl.attachShader(prog,mk(gl.VERTEX_SHADER,VERT)); gl.attachShader(prog,mk(gl.FRAGMENT_SHADER,FRAG));
    gl.linkProgram(prog); gl.useProgram(prog);
    const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
    const pl=gl.getAttribLocation(prog,'position'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
    const U=Object.fromEntries(['uCenter','uHalfSize','uRadius','uAngle','uPx','uLineColor','uBaseColor','uIntensity','uShineSize','uShineFade','uThickness','uBaseWidth'].map(n=>[n,gl.getUniformLocation(prog,n)]));
    const h2r=h=>{const c=h.replace('#','');return[parseInt(c.slice(0,2),16)/255,parseInt(c.slice(2,4),16)/255,parseInt(c.slice(4,6),16)/255];};

    let W=1,H=1;
    const resize=()=>{const r=btn.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round((W+PAD*2)*DPR);canvas.height=Math.round((H+PAD*2)*DPR);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2fv(U.uCenter,[(PAD+W/2)*DPR,(PAD+H/2)*DPR]);gl.uniform2fv(U.uHalfSize,[(W/2)*DPR,(H/2)*DPR]);};
    new ResizeObserver(resize).observe(btn); resize();

    let pAngle=null,proxT=0;
    window.addEventListener('pointermove',e=>{const r=btn.getBoundingClientRect();const cx=r.left+W/2,cy=r.top+H/2;const dx=Math.max(r.left-e.clientX,0,e.clientX-r.right),dy=Math.max(r.top-e.clientY,0,e.clientY-r.bottom);const dist=Math.hypot(dx,dy);pAngle=dist===0?Math.atan2(2/H,-2/W)+((e.clientX-cx)/(W/2))*0.3+((cy-e.clientY)/(H/2))*0.15:Math.atan2(cy-e.clientY,e.clientX-cx);proxT=Math.pow(Math.max(0,1-dist/PROXIMITY),2)*(3-2*Math.max(0,1-dist/PROXIMITY));});

    const lRGB=h2r(LINE_COL),bRGB=h2r(BASE_COL);
    let angle=2.4,idle=2.4,bright=0,last=performance.now();
    (function frame(now){
      const dt=Math.min((now-last)/1000,0.05); last=now;
      idle+=SPEED*dt;
      const diff=(((pAngle!==null?pAngle:idle)-angle+Math.PI*3)%(Math.PI*2))-Math.PI;
      angle+=diff*(1-Math.exp(-dt*7));
      bright+=(proxT-bright)*(1-Math.exp(-dt*8));
      const r=Math.min(RADIUS,Math.min(W,H)/2);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(U.uAngle,angle); gl.uniform1f(U.uRadius,r*DPR); gl.uniform1f(U.uPx,DPR);
      gl.uniform3fv(U.uLineColor,lRGB); gl.uniform3fv(U.uBaseColor,bRGB);
      gl.uniform1f(U.uIntensity,INTENSITY*bright); gl.uniform1f(U.uShineSize,(SHINE_SZ*Math.PI)/180);
      gl.uniform1f(U.uShineFade,(SHINE_FD*Math.PI)/180); gl.uniform1f(U.uThickness,THICKNESS*DPR); gl.uniform1f(U.uBaseWidth,DPR);
      gl.drawArrays(gl.TRIANGLES,0,3);
      requestAnimationFrame(frame);
    })(performance.now());
  })();
  </script>

</body>
</html>
